name: Reusable Security Gate

# Call it from another repository:
#   jobs:
#     security:
#       uses: Chetan-Biranje/Secure-CI-CD-pipelines/.github/workflows/security-gate.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    name: Static scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/security-audit --error

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
